[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaurex-data-platform"
version = "1.0.0"
description = "GAUREX AI Co-Founder (NEO) - Large-Scale Dataset Engineering Platform"
authors = [
  { name = "Gauresh Khairnar", email = "founder@gaurex.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "datasets>=2.18.0",
    "tqdm>=4.66.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "tabulate>=0.9.0"
]

[project.scripts]
gaurex-data-py = "python.cli:main"
