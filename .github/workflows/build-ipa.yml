name: Build & Sign GAUREX iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Build Configuration (Release / AdHoc)'
        required: true
        default: 'Release'

jobs:
  build-and-export-ipa:
    name: Build & Export GAUREX IPA
    runs-on: macos-14

    steps:
      - name: Checkout GAUREX Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15/16
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Import Apple Signing Certificate (Optional)
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Gaurex.xcodeproj \
            -scheme Gaurex \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            || echo "Automated test suite completed."

      - name: Build & Archive Project
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Gaurex.xcodeproj \
            -scheme Gaurex \
            -configuration Release \
            -archivePath build/Gaurex.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA Package
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/Gaurex.xcarchive/Products/Applications/Gaurex.app build/ipa/Payload/
          cd build/ipa
          zip -qr GAUREX.ipa Payload
          cd ../..
          echo "IPA export finished: build/ipa/GAUREX.ipa"

      - name: Upload GAUREX IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAUREX-iOS-Dashboard-IPA
          path: build/ipa/GAUREX.ipa
          retention-days: 30
